version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    # Minor and patch updates are grouped into one PR. Major updates are left
    # ungrouped, so each one gets its own PR that can be tested and merged alone.
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    schedule:
      interval: 'weekly'
    labels:
      - 'mindless: 📦 dependencies'
      - 'problems: security'
    commit-message:
      prefix: 'chore: 🤖 '
    open-pull-requests-limit: 2
    allow:
      - dependency-type: direct
      - dependency-type: production
    ignore:
      # Keep @types/node on the Node major that CI runs (node-version in
      # .github/workflows). Bump it by hand when CI moves to a new major.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
