name: CI

# No path filters: `check` is a required status check, and a workflow skipped
# by a path filter never reports it, which would block the pull request.
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

# A new push to a pull request cancels the run for the previous one
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # setup-node only caches automatically when package.json has a
      # packageManager field, so it is set explicitly
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx eslint .
      - name: Typecheck # Source and tests, see tsconfig.json
        run: npx tsc

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test
        run: npm run test:ci
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: phun-ky/speccer

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      # Packs, lints and installs the tarball, then loads it through import,
      # require, the dist paths, the UMD build and a browser bundle
      - name: Check the package
        run: npm run check:pack

  docs:
    name: Docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The "Last updated" dates come from each page's git history
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The API reference: fails on any TypeDoc warning
      - name: Check the API docs
        run: npm run docs:check
      # A broken site fails the pull request, not the deploy
      - name: Build the docs site
        run: npm run docs:build
      # On main, the site that was just built and checked is what `deploy` publishes
      - name: Setup Pages
        if: >-
          github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload the site
        if: >-
          github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  e2e:
    name: E2E tests (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # Report both browsers, even if one fails
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30

  # The required status check for pull requests. Add new jobs to `needs`.
  check:
    name: check
    # Not always(): a run cancelled by a newer push shouldn't report a failure
    if: ${{ !cancelled() }}
    needs: [lint, unit, build, docs, e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: Check that all jobs passed
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
          RESULTS: lint=${{ needs.lint.result }} unit=${{ needs.unit.result }} build=${{ needs.build.result }} docs=${{ needs.docs.result }} e2e=${{ needs.e2e.result }}
        run: |
          echo "$RESULTS"
          [ "$FAILED" = "false" ]

  # Deploys speccer.dev from main, only after every check has passed
  deploy:
    name: Deploy
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # One deployment at a time; a deployment in progress is never cancelled
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write # Deploy to GitHub Pages
      id-token: write # Verify the deployment's origin
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  notify:
    name: Notify failed check
    needs: [check, deploy]
    if: failure()
    runs-on: ubuntu-24.04
    # GITHUB_TOKEN works on Dependabot PRs too, where secrets are empty
    permissions:
      issues: write
    steps:
      - uses: drivendataorg/failed-build-issue-action@940568ce50eeef3f31a920614cefcc6102d2f930 # v1.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          label-name: 'problems: 💔 build failed'
          create-label: false
