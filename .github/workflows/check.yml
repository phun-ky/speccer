# This is a basic workflow to help you get started with Actions

name: Checks

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: ['main']
    paths: &check-paths
      - '.github/**'
      - 'src/**'
      - 'tests/**'
      - 'docs/**'
      - '**/*.md'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.mjs'
      - '.prettierrc'
      - 'rollup.config.js'
      - 'tsconfig.json'
      - 'tsconfig.test.json'
      - 'postcss.config.cjs'
      - '.browserslistrc'
      - '.release-it.json'
  pull_request:
    branches: ['main']
    types: [opened, synchronize] # Workflow triggering events
    paths: *check-paths

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "check"
  check:
    # The type of runner that the job will run on
    runs-on: ubuntu-24.04

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Checkout all branches and tags
      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npx eslint .
      - name: Build # Build all packages
        run: npm run build
      - name: Test
        run: npm run test:ci
      - name: Import smoke test
        run: |
          node --import global-jsdom/register --input-type=module \
            -e "const m = await import('./dist/speccer.esm.js'); if (typeof m.default !== 'function') throw new Error('default export missing');"
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: phun-ky/speccer
  notify:
    name: Notify failed check
    needs: check
    if: failure()
    runs-on: ubuntu-24.04
    steps:
      - uses: drivendataorg/failed-build-issue-action@v1
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          label-name: 'problems: 💔 build failed'
