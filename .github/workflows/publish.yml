name: Publish

on:
  # Release when a merged PR changes what gets published, or how. The release
  # guard then decides whether there is anything to release.
  pull_request:
    types: [closed]
    branches: ['main']
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'README.md'
      - 'LICENSE'
      - 'rollup.config.js'
      - 'tsconfig.build.json'
      - 'postcss.config.cjs'
      - '.browserslistrc'
      - '.release-it.json'
      - 'scripts/**'
      - '.github/scripts/should-release.sh'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

# Read-only by default; only the publish job gets an OIDC token for npm
permissions:
  contents: read

# One release at a time; never cancel a release halfway
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if:
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    permissions:
      contents: read # Release commits, tags and GitHub releases use GH_TOKEN
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # The release guard and release-it read tags and commits
          token: ${{ secrets.GH_TOKEN }}
      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Ships npm 11, which supports trusted publishing (needs >= 11.5.1).
          # Don't upgrade to npm@latest: npm 12 blocks dependency install scripts.
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Check for changes to release
        id: guard
        run: .github/scripts/should-release.sh
      - name: Audit runtime dependencies # No release with a known high or critical vulnerability
        if: steps.guard.outputs.release == 'true'
        run: npm audit --omit=dev --audit-level=high
      - name: Release # Builds, runs check:pack, then publishes
        if: steps.guard.outputs.release == 'true'
        run: |
          git config user.name "$ACTOR"
          git config user.email "$ACTOR@users.noreply.github.com"
          npm run release
        env: # npm authenticates with trusted publishing (id-token: write), no token needed
          ACTOR: ${{ github.actor }} # via env, never interpolated into the script
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
      - name: Attach SBOM to the release # CycloneDX, with any bundled packages
        if: steps.guard.outputs.release == 'true'
        run: |
          version=$(node -p "require('./package.json').version")
          file="$RUNNER_TEMP/speccer-$version.cdx.json"
          node scripts/sbom.mjs > "$file"
          gh release upload "v$version" "$file" --clobber
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

  notify:
    name: Notify failed build
    needs: publish
    if: failure()
    runs-on: ubuntu-24.04
    # GITHUB_TOKEN is enough to open an issue; GH_TOKEN is for the release only
    permissions:
      issues: write
    steps:
      - uses: drivendataorg/failed-build-issue-action@940568ce50eeef3f31a920614cefcc6102d2f930 # v1.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          label-name: 'problems: 💔 build failed'
          create-label: false
