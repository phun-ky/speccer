name: "Pull Request Labeler"
on:
- pull_request_target

# Read-only by default; the labeler job gets write access below
permissions:
  contents: read

jobs:
  labeler:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
    - id: label-the-PR
      uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
      with:
        sync-labels: true
