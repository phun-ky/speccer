name: Auto Assign
on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

# Read-only by default; the assign job gets write access below
permissions:
  contents: read

jobs:
  run:
    # Dependabot PRs get a read-only GITHUB_TOKEN, so assigning would fail
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      pull-requests: write
    steps:
    - name: 'Auto-assign issue'
      uses: pozil/auto-assign-issue@d6e511896e5f1d2408e74db74416647d8ff80c8c # v4.1.0
      with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          assignees: phun-ky
          numOfAssignee: 1
