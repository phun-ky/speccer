'section: workflows':
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
          - '.github/scripts/**'
'section: repo':
  - changed-files:
      - any-glob-to-any-file:
          - '*'
'section: tests':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/**/__tests__/**'
          - 'tests/**'
          - 'playwright.config.mjs'
'experience: developer':
  - changed-files:
      - any-glob-to-any-file:
          - '.browserslistrc'
          - '.editorconfig'
          - '.gitignore'
          - '.prettierrc'
          - '.release-it.json'
          - 'eslint.config.mjs'
          - 'postcss.config.cjs'
          - 'tsconfig.json'
          - 'tsconfig.build.json'
          - 'typedoc.json'
          - 'scripts/**'
          - 'dev/**'
'context: github':
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
'context: npm':
  - changed-files:
      - any-glob-to-any-file:
          - 'package.json'
          - 'package-lock.json'
'context: rollup':
  - changed-files:
      - any-glob-to-any-file:
          - 'rollup.config.js'
'mindless: ✏️ docs':
  - any:
      - head-branch: ['^docs/']
      - changed-files:
          - any-glob-to-any-file:
              - '**/*.md'
              - 'docs/**'
'mindless: 📦 dependencies':
  - changed-files:
      - any-glob-to-any-file:
          - 'package-lock.json'

# By branch prefix only, so docs/fix-something is not labelled a bug
'✨ feature':
  - head-branch: ['^feat/']
'problems: 🐛 bug':
  - head-branch: ['^fix/']
'mindless: 🤖 chore':
  - head-branch: ['^chore/']
'improvements: 💡 enhancement':
  - head-branch: ['^improvements/']
